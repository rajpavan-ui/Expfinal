<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Expense Tracker</title>

<!-- Android / general PWA install -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1e293b" />

<!-- iOS install support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Expenses" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50">
<div id="root">
  <div style="padding:24px;font-family:sans-serif;color:#94a3b8;text-align:center;">Loading…</div>
</div>
<div id="err-box" style="display:none;padding:16px;margin:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;font-family:monospace;font-size:13px;white-space:pre-wrap;line-height:1.5;"></div>

<script>
  window.addEventListener('error', function (e) {
    if (!e.filename || e.filename.indexOf('app.js') === -1) return;
    var box = document.getElementById('err-box');
    box.style.display = 'block';
    box.textContent = 'Error: ' + (e.message || 'unknown');
  });
</script>

<script src="react-bundle.js"></script>
<script src="pdf-lib.min.js"></script>
<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
